name: Deploy J-A-R-V-I-S Demo

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/configure-pages@v5
      - run: npm ci || npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Verify built site is the J-A-R-V-I-S app
        run: |
          test -f frontend/dist/index.html
          grep -q 'J-A-R-V-I-S personal AI assistant interface' frontend/dist/index.html
          test -d frontend/dist/assets
          ls -lah frontend/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
